version: "3.9"

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: caa_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Copy your backend/.env here for local compose usage
      - DATABASE_URL=sqlite+aiosqlite:///./data/admission_agent.db
      - SECRET_KEY=${SECRET_KEY:-super-secret-change-this-in-production}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - UPLOAD_DIR=uploads
      - CHROMA_PERSIST_DIR=data/chroma
      - CHROMA_COLLECTION_NAME=college_docs
      - EMBEDDING_MODEL_NAME=all-MiniLM-L6-v2
      - IBM_WATSONX_API_KEY=${IBM_WATSONX_API_KEY:-}
      - IBM_WATSONX_PROJECT_ID=${IBM_WATSONX_PROJECT_ID:-}
      - IBM_WATSONX_URL=${IBM_WATSONX_URL:-https://us-south.ml.cloud.ibm.com}
      - IBM_GRANITE_MODEL_ID=${IBM_GRANITE_MODEL_ID:-ibm/granite-3-8b-instruct}
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: caa_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
  backend_uploads:
